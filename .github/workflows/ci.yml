name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Backend Regression & ML Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fasal_sarthi_backend/requirements.txt

      - name: Run ML Parity & SHA256 Verification
        run: |
          python scripts/verify_ml_parity.py

      - name: Run Full Backend Regression Test Suite
        run: |
          python scripts/run_phase4_backend_tests.py

  frontend-verification:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fasal_sarthi_frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fasal_sarthi_frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Frontend ESLint Verification (0 Errors Target)
        run: npm run lint

      - name: Frontend Production Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://fasal-sarthi-backend.onrender.com
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
